name: Bug report
description: Something in subenum doesn't work as documented
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not include sensitive information, unauthorized scan results, or private domain details you don't have permission to disclose.** Use `example.com` or a `-simulate` run where you can.

        Found a security vulnerability? Report it privately instead: https://github.com/TMHSDigital/subenum/security/advisories/new
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command, and the wordlist size or content if it matters.
      placeholder: |
        subenum -simulate -w words.txt example.com
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Terminal output, or the run-quality report from `-stats`.
      render: text
  - type: input
    id: version
    attributes:
      label: subenum version
      description: Output of `subenum -version`.
      placeholder: v0.8.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 15
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
