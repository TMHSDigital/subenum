version: 2
# Work happens directly on main, so each ecosystem's updates are grouped into
# a single weekly PR rather than one PR per package.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Include indirect modules (x/sys, x/text), which otherwise go stale (#83).
    allow:
      - dependency-type: "all"
    groups:
      go-modules:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"

  # Dockerfile base images are pinned by digest and would otherwise go stale.
  # That includes the devcontainers' images, which Codespaces and the
  # devcontainer CI job use (#187, #244).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
      - "/.devcontainer/labs"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    # devcontainers/go tags lead with the image version once it is 2.x
    # (2.3-bookworm is image 2.3 with Go 1.27), which Dependabot reads as a
    # newer release of 1.26-bookworm. Keep the Go 1.26 tag and take its new
    # digests instead.
    ignore:
      - dependency-name: "devcontainers/go"
        versions: [">= 2"]
    labels:
      - "dependencies"
      - "docker"

  # Devcontainer Features, should either devcontainer.json add any. It does
  # not bump the images: those are in Dockerfiles, under docker above (#244).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      devcontainers:
        patterns: ["*"]
    labels:
      - "dependencies"
