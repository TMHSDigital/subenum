version: 2
# Work happens directly on main, so each ecosystem's updates are grouped into
# a single weekly PR rather than one PR per package.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Include indirect modules (x/sys, x/text), which otherwise go stale (#83).
    allow:
      - dependency-type: "all"
    groups:
      go-modules:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"

  # Dockerfile base images are pinned by digest and would otherwise go stale.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "docker"
