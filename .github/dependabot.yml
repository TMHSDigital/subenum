version: 2
# Work happens directly on main, so each ecosystem's updates are grouped into
# a single weekly PR rather than one PR per package.
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Include indirect modules (x/sys, x/text), which otherwise go stale (#83).
    allow:
      - dependency-type: "all"
    groups:
      go-modules:
        patterns: ["*"]
    # lipgloss v2.1.0 requires go 1.26.7; the supported minimum stays at
    # go 1.26.0 (CI's "Check go directive") until it is raised on purpose.
    ignore:
      - dependency-name: "charm.land/lipgloss/v2"
        versions: [">= 2.1.0"]
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"

  # Dockerfile base images are pinned by digest and would otherwise go stale.
  # That includes the devcontainers' images, which Codespaces and the
  # devcontainer CI job use (#187, #244).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
      - "/.devcontainer/labs"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns: ["*"]
    # devcontainers/go also has tags that lead with the image version
    # (2.3-bookworm is image 2.3 with Go 1.27), which Dependabot reads as a
    # newer release of the <go version>-bookworm tag the devcontainers use.
    # Ignore those, so updates stay on Go-version tags and their digests.
    ignore:
      - dependency-name: "devcontainers/go"
        versions: [">= 2"]
    labels:
      - "dependencies"
      - "docker"

  # Devcontainer Features, should either devcontainer.json add any. It does
  # not bump the images: those are in Dockerfiles, under docker above (#244).
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      devcontainers:
        patterns: ["*"]
    labels:
      - "dependencies"
