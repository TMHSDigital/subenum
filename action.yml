name: subenum
description: Subdomain enumeration you can trust, with change detection and a run-quality verdict that gates the job.
author: TMHSDigital
branding:
  icon: search
  color: blue

inputs:
  domain:
    description: Domain to scan. Only scan domains you own or are authorized to test.
    required: false
    default: ""
  domains-file:
    description: File of apex domains, one per line (-dL), instead of domain.
    required: false
    default: ""
  wordlist:
    description: Wordlist file (-w). Empty uses the bundled top-5000 list.
    required: false
    default: ""
  args:
    description: >-
      Extra subenum flags, separated by spaces or newlines (no quoting), e.g.
      "-rate 200 -type A,AAAA,CNAME -ct". A multi-line "args: |" block works.
    required: false
    default: ""
  previous:
    description: A previous results file to diff against (-diff). Overrides baseline-artifact.
    required: false
    default: ""
  baseline-artifact:
    description: >-
      Name of a workflow artifact holding the previous results. The newest one
      that this workflow uploaded from the default branch, outside pull
      requests, is downloaded and diffed against, and a complete run uploads its results
      under the same name for next time. A run that max-duration stops saves
      its resume state there too, and the next run continues that scan rather
      than starting over. Empty disables it.
    required: false
    default: ""
  sarif:
    description: Write takeover candidates to this SARIF file, for github/codeql-action/upload-sarif. Needs CNAME or NS in -type.
    required: false
    default: ""
  max-duration:
    description: >-
      Time budget for the scan (-max-duration), e.g. 20m. Keep it under the
      job's timeout-minutes: at the budget the scan stops testing new names
      and still writes its results and report, with a degraded verdict. With
      baseline-artifact, the next run resumes where this one stopped, so a
      scheduled job works through a large wordlist over several runs.
      Empty means no budget. Needs a subenum release newer than v0.10.0.
    required: false
    default: ""
  fail-on:
    description: >-
      Fail the step when the verdict is at least this bad: unreliable, degraded
      or never. With never, a scan that failed (verdict unreliable) still passes
      the step; read the verdict output instead. Usage errors and a run with no
      report always fail.
    required: false
    default: unreliable
  version:
    description: subenum release to install ("latest", or a tag such as v0.9.0), or "source" to build the action's own checkout (needs Go).
    required: false
    default: latest
  token:
    description: Token for downloading the release and the baseline artifact.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: Run-quality verdict, complete, degraded or unreliable.
    value: ${{ steps.scan.outputs.verdict }}
  resumed:
    description: true when this run continued a scan that an earlier run's max-duration stopped (with baseline-artifact).
    value: ${{ steps.scan.outputs.resumed }}
  found:
    description: Names found.
    value: ${{ steps.scan.outputs.found }}
  added:
    description: Names added since the previous results (with previous or baseline-artifact).
    value: ${{ steps.scan.outputs.added }}
  removed:
    description: Names removed since the previous results.
    value: ${{ steps.scan.outputs.removed }}
  changed:
    description: Names whose records changed since the previous results (add -diff-records to args).
    value: ${{ steps.scan.outputs.changed }}
  changes:
    description: >-
      Path of the changes (JSONL): one line per added, removed or changed name
      with a "change" field, then the run summary. Empty when there were no
      previous results to diff against.
    value: ${{ steps.scan.outputs.changes }}
  takeovers:
    description: Takeover candidates among the names found (needs CNAME or NS in -type).
    value: ${{ steps.scan.outputs.takeovers }}
  internal:
    description: Names found that answer with an address that is not public.
    value: ${{ steps.scan.outputs.internal }}
  results:
    description: Path of the full results (JSONL).
    value: ${{ steps.scan.outputs.results }}
  stats:
    description: Path of the run-quality report (JSON).
    value: ${{ steps.scan.outputs.stats }}

runs:
  using: composite
  steps:
    - name: Install subenum
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        bin="$RUNNER_TEMP/subenum-bin"
        mkdir -p "$bin"
        if [ "$VERSION" = source ]; then
          (cd "$GITHUB_ACTION_PATH" && go build -trimpath -o "$bin/" .)
        else
          if [ "$VERSION" = latest ]; then
            VERSION=$(gh release view --repo TMHSDigital/subenum --json tagName --jq .tagName)
          fi
          v="${VERSION#v}"
          case "$(uname -s)" in
            Linux) os=linux ext=tar.gz ;;
            Darwin) os=darwin ext=tar.gz ;;
            MINGW* | MSYS* | CYGWIN*) os=windows ext=zip ;;
            *) echo "unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64 | amd64) arch=amd64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          archive="subenum_${v}_${os}_${arch}.${ext}"
          dl="$RUNNER_TEMP/subenum-dl"
          mkdir -p "$dl"
          gh release download "v${v}" --repo TMHSDigital/subenum --dir "$dl" --clobber \
            --pattern "$archive" --pattern checksums.txt
          (cd "$dl" && if command -v sha256sum > /dev/null; then sha256sum --check --ignore-missing checksums.txt; \
            else shasum -a 256 --check --ignore-missing checksums.txt; fi)
          # Checksums and archive can be replaced together. Provenance binds
          # this exact archive to the repository's trusted release workflow.
          gh attestation verify "$dl/$archive" --repo TMHSDigital/subenum
          if [ "$ext" = zip ]; then unzip -o -q "$dl/$archive" -d "$dl/x"; else mkdir -p "$dl/x" && tar -xzf "$dl/$archive" -C "$dl/x"; fi
          find "$dl/x" -maxdepth 2 -name 'subenum*' -type f \( -name subenum -o -name subenum.exe \) -exec cp {} "$bin/" \;
        fi
        echo "$bin" >> "$GITHUB_PATH"

    - name: Download the baseline
      if: inputs.baseline-artifact != '' && inputs.previous == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        NAME: ${{ inputs.baseline-artifact }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/subenum-baseline"
        # A second use in the same job must not resume or diff the first's.
        rm -rf "$dir"
        mkdir -p "$dir"
        # An earlier use in this job kept a copy of what it saved: the
        # artifact list can lag an upload by seconds, so it may not show yet.
        saved="$RUNNER_TEMP/subenum-saved/${NAME//[^A-Za-z0-9._-]/_}"
        if [ -d "$saved" ]; then
          cp -R "$saved/." "$dir/"
          echo "Using the baseline an earlier step in this job saved."
          exit 0
        fi
        # upload-artifact allows &, +, # and % in names. Encode the name so the
        # query string cannot truncate or reinterpret it (#407).
        encoded=$(jq -rn --arg n "$NAME" '$n|@uri')
        # Any workflow run can upload an artifact under this name, a fork pull
        # request's included. Take the newest one that this workflow uploaded
        # from the default branch of this repository, outside pull requests.
        branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
        workflow="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY"/}"
        workflow="${workflow%%@*}"
        run=""
        # Newest first. The artifact's own head fields rule out forks and other
        # branches cheaply; the run itself says which workflow and event made it.
        candidates=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$encoded&per_page=100" \
          --jq '.artifacts[] | select(.expired == false) | .workflow_run
            | select(.head_repository_id == .repository_id) | "\(.id) \(.head_branch)"')
        while read -r id head; do
          [ -n "$id" ] && [ "$head" = "$branch" ] || continue
          made=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '"\(.path | sub("@.*$"; "")) \(.event)"')
          case "$made" in
            "$workflow pull_request"*) ;;
            "$workflow "*) run="$id"; break ;;
          esac
        done <<< "$candidates"
        if [ -n "$run" ]; then
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir "$dir"
        else
          echo "No baseline artifact named $NAME from this workflow on $branch yet; this run sets it."
        fi

    - name: Scan
      id: scan
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        DOMAINS_FILE: ${{ inputs.domains-file }}
        WORDLIST: ${{ inputs.wordlist }}
        ARGS: ${{ inputs.args }}
        PREVIOUS: ${{ inputs.previous }}
        BASELINE: ${{ inputs.baseline-artifact }}
        SARIF: ${{ inputs.sarif }}
        MAX_DURATION: ${{ inputs.max-duration }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -o pipefail
        out="$RUNNER_TEMP/subenum-out"
        mkdir -p "$out"
        # A second use in the same job must not read the first use's report.
        rm -f "$out/run.json" "$out/results.jsonl" "$out/changes.jsonl" "$out/state.json"
        flags=(-silent -format jsonl -o "$out/results.jsonl" -stats "$out/run.json" -state "$out/state.json")
        [ -n "$WORDLIST" ] && flags+=(-w "$WORDLIST")
        [ -n "$SARIF" ] && flags+=(-sarif "$SARIF")
        [ -n "$MAX_DURATION" ] && flags+=(-max-duration "$MAX_DURATION")
        prev="$PREVIOUS"
        if [ -z "$prev" ] && [ -n "$BASELINE" ] && [ -s "$RUNNER_TEMP/subenum-baseline/results.jsonl" ]; then
          prev="$RUNNER_TEMP/subenum-baseline/results.jsonl"
        fi
        [ -n "$prev" ] && flags+=(-diff "$prev")
        # -d '' reads past newlines, so every line of an "args: |" block counts;
        # read then returns 1 at the end of input.
        read -r -d '' -a extra <<< "$ARGS" || true
        if [ -n "$DOMAINS_FILE" ]; then target=(-dL "$DOMAINS_FILE"); else target=("$DOMAIN"); fi
        if [ -z "$DOMAIN" ] && [ -z "$DOMAINS_FILE" ]; then echo "::error::set domain or domains-file"; exit 2; fi

        # The runner's bash has -e: capture the exit code instead of dying on 4.
        code=0
        # A run that max-duration stopped left its resume state in the
        # baseline artifact (#352). The state replays its own command line,
        # output paths included, so it is only resumed when this run's inputs
        # (and output directory) are the same; subenum itself refuses a
        # changed wordlist or other input file, and then a new scan starts.
        base="$RUNNER_TEMP/subenum-baseline"
        key=$(printf '%s\n' "$DOMAIN" "$DOMAINS_FILE" "$WORDLIST" "$ARGS" "$SARIF" "$out" "$prev")
        resumed=false
        # The state's command line is replayed as it is, so it must be the one
        # this run would run anyway: a state that names other flags or paths
        # starts a new scan. The time budget is left out on both sides: it may
        # change between runs (a resumed run appends -max-duration=VALUE), and
        # a simulation pins a leading -seed; neither changes what is scanned.
        strip='def strip: if length == 0 then .
          elif .[0] == "-max-duration" then .[2:] | strip
          elif (.[0] | startswith("-max-duration=")) then .[1:] | strip
          else [.[0]] + (.[1:] | strip) end;'
        want=$(printf '%s\0' "${flags[@]}" "${extra[@]}" "${target[@]}" | jq -Rsc "$strip"' split("\u0000") | .[:-1] | strip')
        same_args() {
          jq -e --argjson want "$want" "$strip"' (.args | if .[0] == "-seed" then .[2:] else . end | strip) == $want' \
            "$base/state.json" > /dev/null 2>&1
        }
        if [ -z "$PREVIOUS" ] && [ -n "$BASELINE" ] && [ -s "$base/state.json" ]; then
          if [ "$(cat "$base/state.key" 2> /dev/null)" = "$key" ] && same_args; then
            echo "Resuming the scan an earlier run's time budget stopped."
            subenum -resume "$base/state.json" -max-duration "${MAX_DURATION:-0}" > "$out/changes.jsonl" || code=$?
            if [ -s "$out/run.json" ]; then
              resumed=true
            else
              echo "::notice::The stopped scan could not be resumed (exit $code, see above); starting a new scan."
              code=0
            fi
          else
            echo "::notice::The inputs changed since the run that saved the resume state; starting a new scan."
          fi
        fi
        if [ "$resumed" = false ]; then
          subenum "${flags[@]}" "${extra[@]}" "${target[@]}" > "$out/changes.jsonl" || code=$?
        fi
        if [ ! -s "$out/run.json" ]; then
          echo "::error::subenum exited $code without a report"
          # -dry-run and -version exit 0 without writing a report; the step
          # must still fail rather than pass on the previous use's outputs (#407).
          [ "$code" -ne 0 ] || code=1
          exit "$code"
        fi

        verdict=$(jq -r .verdict "$out/run.json")
        reason=$(jq -r .reason "$out/run.json")
        # -permute hits are counted apart from the main pass.
        found=$(jq '[.targets[] | (.found // 0) + (.permutation.found // 0)] | add // 0' "$out/run.json")
        added=$(jq '.diff.added // 0' "$out/run.json")
        removed=$(jq '.diff.removed // 0' "$out/run.json")
        changed=$(jq '.diff.changed // 0' "$out/run.json")
        takeovers=$(jq '[.targets[].takeover_candidates // 0] | add // 0' "$out/run.json")
        internal=$(jq '[.targets[].internal_addresses // 0] | add // 0' "$out/run.json")
        {
          echo "verdict=$verdict"; echo "resumed=$resumed"; echo "found=$found";echo "added=$added"; echo "removed=$removed"; echo "changed=$changed"
          echo "takeovers=$takeovers"; echo "internal=$internal"
          echo "results=$out/results.jsonl"; echo "stats=$out/run.json"
          # Without -diff the scan prints every result, not changes.
          if [ -n "$prev" ]; then echo "changes=$out/changes.jsonl"; fi
        } >> "$GITHUB_OUTPUT"

        {
          echo "### subenum: $verdict"
          echo
          echo "$reason"
          echo
          echo "| Target | Verdict | Found | Queries | Takeover candidates | Internal addresses |"
          echo "|---|---|---|---|---|---|"
          jq -r '.targets[] | "| \(.domain) | \(.verdict) | \((.found // 0) + (.permutation.found // 0)) | \(.queries_sent // 0) | \(.takeover_candidates // 0) | \(.internal_addresses // 0) |"' "$out/run.json"
          if [ "$takeovers" != 0 ]; then
            echo
            echo "**Takeover candidates:** $takeovers"
            # jq stops at 50 itself: `| head -50` would close the pipe under
            # pipefail and fail the step on a long list.
            jq -rn 'limit(50; inputs | select(.takeover_candidate) | "- `\(.subdomain)`: \(.takeover_candidate)")' "$out/results.jsonl"
          fi
          if [ -n "$prev" ]; then
            echo
            echo "**Changes since the previous results:** $added added, $removed removed, $changed changed."
            jq -rn 'limit(50; inputs | select(.change == "added") | "- `+ \(.subdomain)`")' "$out/changes.jsonl"
            jq -rn 'limit(50; inputs | select(.change == "removed") | "- `- \(.subdomain)`")' "$out/changes.jsonl"
            jq -rn 'limit(50; inputs | select(.change == "changed") | "- `~ \(.subdomain)`: \([.previous_records[]? | "\(.type) \(.value)"] | join(", ")) -> \([.records[] | "\(.type) \(.value)"] | join(", "))")' "$out/changes.jsonl"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        # The artifact carries a complete run's results, or a stopped run's
        # resume state next to the results it still diffs against (#352).
        carry="$RUNNER_TEMP/subenum-carry"
        rm -rf "$carry"
        mkdir -p "$carry"
        if [ -n "$BASELINE" ] && [ "$verdict" = complete ]; then
          cp "$out/results.jsonl" "$carry/"
          echo "upload=true" >> "$GITHUB_OUTPUT"
        elif [ -n "$BASELINE" ] && [ -z "$PREVIOUS" ] && [ -s "$out/state.json" ]; then
          if [ -s "$base/results.jsonl" ]; then cp "$base/results.jsonl" "$carry/"; fi
          cp "$out/state.json" "$carry/"
          printf '%s\n' "$key" > "$carry/state.key"
          echo "carry-state=true" >> "$GITHUB_OUTPUT"
          echo "::notice::The scan stopped before it finished; the next run with baseline-artifact $BASELINE continues it."
        elif [ -n "$BASELINE" ] && [ "$resumed" = true ]; then
          # The resumed scan finished below complete and spent its state.
          # Replace the artifact without that state, or every later run
          # resumes the same remainder again (#396). The marker file keeps
          # the upload from being empty when there are no results to carry.
          if [ -s "$base/results.jsonl" ]; then cp "$base/results.jsonl" "$carry/"; fi
          printf 'The resumed scan finished %s; the next run starts a new scan.\n' "$verdict" > "$carry/state-spent.txt"
          echo "carry-state=true" >> "$GITHUB_OUTPUT"
        fi
        # 0 = ok, 4 = changes found; 3 = some -dL targets failed and 1 = the
        # scan failed, and the verdict says how bad, so fail-on decides. A 1
        # with a complete verdict is a failed output file: always fail.
        case "$code:$verdict" in
          0:* | 3:* | 4:* | 1:degraded | 1:unreliable) ;;
          *) exit "$code" ;;
        esac
        case "$FAIL_ON:$verdict" in
          unreliable:unreliable | degraded:unreliable | degraded:degraded)
            echo "::error::subenum verdict is $verdict: $reason"; exit 1 ;;
        esac

    - name: Save the baseline
      id: save
      # A stopped run whose verdict fails the step under fail-on still saves
      # its state.
      if: ${{ (success() && steps.scan.outputs.upload == 'true') || (!cancelled() && steps.scan.outputs.carry-state == 'true') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.baseline-artifact }}
        path: ${{ runner.temp }}/subenum-carry/
        retention-days: 90
        overwrite: true

    - name: Keep the baseline for later uses in this job
      if: ${{ !cancelled() && steps.save.outcome == 'success' }}
      shell: bash
      env:
        NAME: ${{ inputs.baseline-artifact }}
      run: |
        set -euo pipefail
        saved="$RUNNER_TEMP/subenum-saved/${NAME//[^A-Za-z0-9._-]/_}"
        rm -rf "$saved"
        mkdir -p "$saved"
        cp -R "$RUNNER_TEMP/subenum-carry/." "$saved/"
