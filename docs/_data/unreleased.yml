# Documented on main but not in the latest release yet (#213). The site tags
# each one "unreleased" through _includes/unreleased.html, and `make
# docs-flags` tags the listed flags in the generated CLI table.
#
# In the release commit, empty these lists and run `make docs-flags`.
# subcommands (#245)
commands:
  - mcp
  - diff
flags:
  - auto-rate
  - axfr
  - diff-records
  - dry-run
  - inconclusive
  - log-format
  - max-duration
  - rate-per-resolver
  - retry-inconclusive
  - sources
  - takeover-providers
  - takeover-providers-only
# new values of a flag that is itself released, as flag=VALUE (#306)
values:
  - type=NS
  - type=MX
  - type=TXT
  - o=format:path
# action.yml inputs and outputs
action:
  - max-duration
  - changed
  - changes
  - takeovers
  - internal
  - resumed
# pkg/subenum identifiers
library:
  - Config.Validate
  - ErrNoWords
  - AutoRate
  - Diff
  - Internal
  - MaxDuration
  - Permutations
  - ProbeZone
  - RatePerResolver
  - Sources
  - RetryInconclusive
  - TakeoverProviders
  - Verdict
  - ZoneTransfer
