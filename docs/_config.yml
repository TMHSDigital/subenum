title: subenum
tagline: every DNS query, accounted for
description: Subdomain enumeration you can trust. subenum classifies every DNS lookup, grades the run complete, degraded or unreliable, and ships as a single static Go binary.
show_downloads: false
url: "https://tmhsdigital.github.io"
baseurl: "/subenum"
repository: TMHSDigital/subenum
# sitemap.xml for search engines (#125); jekyll-sitemap ships with GitHub Pages.
plugins:
  - jekyll-sitemap
# Shown when a page link is shared (og:image / twitter:card).
social_image: /assets/social-preview.png
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
# Internal templates and local build output are not part of the site.
exclude:
  - DOCUMENTATION_STRUCTURE.md
  - _preview
  - .jekyll-cache
