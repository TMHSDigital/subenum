<svg xmlns="http://www.w3.org/2000/svg" width="860" height="526" viewBox="0 0 860 526" role="img" aria-label="subenum in a terminal. Lab 1: six hosts resolve with their A, AAAA and CNAME records, blog.lab.example is flagged as a dangling-CNAME takeover candidate, and the tally shows 6 resolved and 24 nxdomain. Lab 2: every name resolves, so subenum reports a wildcard and refuses; with -force it fingerprints the wildcard, keeps www, intranet and portal, and filters 27 wildcard answers.">
