<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.1500;0.4375;1.0000" dur="24.0s" repeatCount="indefinite" calcMode="discrete"/><text x="24" y="104" xml:space="preserve"></text></g>
