<text x="430.0" y="22" text-anchor="middle" fill="#6F7E97" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600">subenum · lab mode, no traffic leaves the machine</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<g opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0.0000;0.0167;0.4375;1.0000" dur="24.0s" repeatCount="indefinite" calcMode="discrete"/><text x="24" y="64" xml:space="preserve"><tspan fill="#6F7E97"># Lab 1: a first scan against a local zone. Every query is accounted for.</tspan></text></g>
