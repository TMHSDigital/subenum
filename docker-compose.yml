services:
  subenum:
    build: .
    volumes:
      - ./examples:/home/nonroot/examples
      - ./data:/data
    tty: true
    stdin_open: true
    # Simulation by default: a bare `docker compose up` sends no DNS traffic.
    # For a live scan, name a domain you own or are authorized to test:
    #   docker compose run --rm subenum -w /data/wordlist.txt -v yourdomain.com
    command: ["-simulate", "-w", "/data/wordlist.txt", "-v", "example.com"]
