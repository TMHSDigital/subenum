version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - gocritic
    - misspell
    - unconvert
    - errorlint
    - nilerr
    - contextcheck
    - noctx
    - copyloopvar
    - usestdlibvars
    - revive
  settings:
    gosec:
      excludes:
        # G304: File path provided as taint input, expected for a wordlist tool
        - G304
        # G404: Weak RNG is fine; math/rand/v2 only drives simulation output, which is not security-sensitive
        - G404
    errcheck:
      # Only stdout prints are exempt: a closed pipe there is not actionable.
      # Writes to files and other io.Writers must handle their errors (#83).
      exclude-functions:
        - fmt.Printf
        - fmt.Println
  exclusions:
    rules:
      # Test files are allowed to use gosec-flagged patterns
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
